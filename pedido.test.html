<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Pruebas de pedido.js</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos propios de esta página de pruebas, no tocan style.css */
    .contenedor-principal { max-width: 640px; text-align: left; }
    h2 { text-align: left; }
    ul { list-style: none; }
    li {
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    li.ok {
      background: rgba(30, 122, 52, 0.1);
      border-left: 4px solid #1e7a34;
      color: #14501f;
    }
    li.fail {
      background: rgba(179, 38, 30, 0.1);
      border-left: 4px solid #b3261e;
      color: #7a1a14;
    }
    #resumen {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="contenedor-principal">
    <h2>Pruebas automáticas — js/pedido.js</h2>
    <p style="margin-bottom: 16px; color: #532f46; font-size: 0.9rem;">
      Esta página corre pruebas sobre las funciones puras de <code>pedido.js</code>
      (sin DOM, sin Firebase) apenas se carga. Ábrela con Live Server igual que
      las demás vistas: <code>127.0.0.1:5500/pedido.test.html</code>
    </p>

    <ul id="lista-resultados"></ul>
    <div id="resumen"></div>

    <div class="nav-link">
      <a href="index.html">← Volver a RestoApp</a>
    </div>
  </div>

  <script type="module">
    import { calcularTotales, formatearMoneda, TASA_IVA, calcularTotalCarrito } from "./js/pedido.js";

    // -------------------------------------------------------------------
    // Mini "framework" de pruebas: nada de librerías externas, solo
    // funciones simples de aserción para que sea fácil de leer y extender.
    // -------------------------------------------------------------------
    const resultados = [];

    function afirmar(descripcion, condicion) {
      resultados.push({ descripcion, paso: Boolean(condicion) });
    }

    function afirmarLanza(descripcion, fn) {
      try {
        fn();
        resultados.push({ descripcion, paso: false, nota: "no lanzó error" });
      } catch (error) {
        resultados.push({ descripcion, paso: true });
      }
    }

    function cercaDe(valor, esperado, tolerancia = 0.001) {
      return Math.abs(valor - esperado) < tolerancia;
    }

    // --- Casos de prueba ------------------------------------------------

    afirmar(
      "calcularTotales(2, 1000) calcula subtotal correcto",
      cercaDe(calcularTotales(2, 1000).subtotal, 2000)
    );

    afirmar(
      "calcularTotales(2, 1000) calcula IVA al 19%",
      cercaDe(calcularTotales(2, 1000).iva, 380)
    );

    afirmar(
      "calcularTotales(2, 1000) calcula total con IVA incluido",
      cercaDe(calcularTotales(2, 1000).total, 2380)
    );

    afirmar(
      "calcularTotales acepta una tasa de IVA personalizada",
      cercaDe(calcularTotales(1, 1000, 0.10).total, 1100)
    );

    afirmar(
      "TASA_IVA exportada es 0.19 (19%)",
      TASA_IVA === 0.19
    );

    afirmarLanza(
      "calcularTotales(0, 1000) lanza error por cantidad inválida",
      () => calcularTotales(0, 1000)
    );

    afirmarLanza(
      "calcularTotales(-1, 1000) lanza error por cantidad negativa",
      () => calcularTotales(-1, 1000)
    );

    afirmarLanza(
      "calcularTotales(2, 0) lanza error por precio inválido",
      () => calcularTotales(2, 0)
    );

    afirmarLanza(
      "calcularTotales(NaN, 1000) lanza error por cantidad no numérica",
      () => calcularTotales(NaN, 1000)
    );

    afirmar(
      "formatearMoneda formatea con signo $ y sin decimales",
      formatearMoneda(15000) === "$15.000"
    );

    afirmar(
      "formatearMoneda redondea valores con decimales",
      formatearMoneda(999.6) === "$1.000"
    );

    afirmar(
      "calcularTotalCarrito suma subtotales de varios ítems",
      cercaDe(
        calcularTotalCarrito([
          { cantidad: 2, precioUnitario: 1000 },
          { cantidad: 1, precioUnitario: 500 },
        ]).subtotal,
        2500
      )
    );

    afirmar(
      "calcularTotalCarrito calcula IVA sobre el subtotal total, no por ítem",
      cercaDe(
        calcularTotalCarrito([
          { cantidad: 2, precioUnitario: 1000 },
          { cantidad: 1, precioUnitario: 500 },
        ]).iva,
        475
      )
    );

    afirmarLanza(
      "calcularTotalCarrito([]) lanza error por carrito vacío",
      () => calcularTotalCarrito([])
    );

    afirmarLanza(
      "calcularTotalCarrito con un ítem de cantidad inválida lanza error",
      () => calcularTotalCarrito([{ cantidad: 0, precioUnitario: 1000 }])
    );

    // --- Render de resultados -------------------------------------------

    const lista = document.getElementById('lista-resultados');
    const resumen = document.getElementById('resumen');
    let aprobadas = 0;

    resultados.forEach(({ descripcion, paso, nota }) => {
      const li = document.createElement('li');
      li.className = paso ? 'ok' : 'fail';
      li.textContent = `${paso ? '✔' : '✘'} ${descripcion}${nota ? ` (${nota})` : ''}`;
      lista.appendChild(li);
      if (paso) aprobadas++;
    });

    resumen.textContent = `${aprobadas} / ${resultados.length} pruebas pasaron`;
    resumen.style.color = aprobadas === resultados.length ? '#1e7a34' : '#b3261e';
  </script>
</body>
</html>
