<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliveryBot - Cocina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-principal contenedor-ancho">
    <section id="vista-login">
      <h2>Acceso Administrador</h2>
      <p class="texto-ayuda">Inicia sesión para ver y gestionar los pedidos.</p>
      <form id="form-login">
        <div class="item">
          <label for="email">Correo</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="item">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login">INICIAR SESIÓN</button>
      </form>
      <div id="res-login" role="status" aria-live="polite"></div>
    </section>

    <section id="vista-pedidos" class="oculto">
      <div class="admin-header">
        <h2>Pedidos</h2>
        <button type="button" id="btn-logout" class="btn-secundario">Cerrar sesión</button>
      </div>

      <div class="fila-form">
        <div class="item">
          <label for="filtro-estado">Filtrar por estado</label>
          <select id="filtro-estado"></select>
        </div>
        <div class="item">
          <label>&nbsp;</label>
          <button type="button" id="btn-refrescar" class="btn-secundario">🔄 Actualizar</button>
        </div>
      </div>

      <div id="res-pedidos" role="status" aria-live="polite"></div>

      <ul id="lista-pedidos" class="lista-pedidos">
        <li class="lista-vacia">Cargando pedidos...</li>
      </ul>

      <div class="nav-link">
        <a href="admin.html">← Gestión de Menú</a>
      </div>
    </section>

    <div class="nav-link">
      <a href="index.html">Inicio</a>
    </div>
  </div>

  <script type="module">
    import { iniciarSesion, cerrarSesion, observarSesion, mensajeErrorAuth } from "./js/auth.js";
    import { obtenerPedidos, actualizarEstadoPedido, ESTADOS_PEDIDO } from "./js/pedidos.js";
    import { formatearMoneda } from "./js/pedido.js";

    const vistaLogin = document.getElementById("vista-login");
    const vistaPedidos = document.getElementById("vista-pedidos");
    const formLogin = document.getElementById("form-login");
    const btnLogin = document.getElementById("btn-login");
    const resLogin = document.getElementById("res-login");
    const btnLogout = document.getElementById("btn-logout");
    const filtroEstado = document.getElementById("filtro-estado");
    const btnRefrescar = document.getElementById("btn-refrescar");
    const resPedidos = document.getElementById("res-pedidos");
    const listaPedidos = document.getElementById("lista-pedidos");

    let pedidosCache = {};
    let intervaloAuto = null;

    function mostrarMensaje(el, texto, tipo = "exito") {
      el.textContent = texto;
      el.classList.remove("mensaje-error", "mensaje-exito");
      el.classList.add(tipo === "error" ? "mensaje-error" : "mensaje-exito");
    }

    function claseEstado(estado) {
      const mapa = {
        Recibido: "estado-pendiente",
        Preparación: "estado-preparacion",
        "En camino": "estado-listo",
        Entregado: "estado-entregado",
      };
      return mapa[estado] || "estado-pendiente";
    }

    function poblarFiltro() {
      filtroEstado.innerHTML =
        '<option value="">Todos los estados</option>' +
        ESTADOS_PEDIDO.map((e) => `<option value="${e}">${e}</option>`).join("");
    }

    function opcionesEstado(actual) {
      return ESTADOS_PEDIDO
        .map((e) => `<option value="${e}" ${e === actual ? "selected" : ""}>${e}</option>`)
        .join("");
    }

    async function cargarPedidos() {
      try {
        pedidosCache = await obtenerPedidos();
        pintarLista();
      } catch (error) {
        console.error("Error al cargar pedidos:", error);
        listaPedidos.innerHTML = '<li class="lista-vacia">No se pudieron cargar los pedidos.</li>';
      }
    }

    function pintarLista() {
      const filtro = filtroEstado.value;
      const entradas = Object.entries(pedidosCache)
        .filter(([, pedido]) => !filtro || pedido.estado === filtro)
        .sort(([, a], [, b]) => new Date(`${b.fecha} ${b.hora}`) - new Date(`${a.fecha} ${a.hora}`));

      if (entradas.length === 0) {
        listaPedidos.innerHTML = '<li class="lista-vacia">No hay pedidos que mostrar.</li>';
        return;
      }

      listaPedidos.innerHTML = "";
      entradas.forEach(([id, pedido]) => {
        const li = document.createElement("li");
        li.className = "tarjeta-pedido";
        li.innerHTML = `
          <div class="tarjeta-pedido-header">
            <span class="tarjeta-pedido-mesa">Usuario: ${pedido.id_usuario}</span>
            <span class="etiqueta-categoria ${claseEstado(pedido.estado)}">${pedido.estado}</span>
          </div>
          <p class="tarjeta-pedido-items">${pedido.detalles_pedido}</p>
          <div class="tarjeta-pedido-footer">
            <span class="fila-plato-precio">${formatearMoneda(pedido.total_pago)}</span>
            <span class="texto-ayuda" style="margin:0;">${pedido.hora || "--"}</span>
            <select class="select-estado" data-id="${id}">${opcionesEstado(pedido.estado)}</select>
          </div>
        `;
        listaPedidos.appendChild(li);
      });
    }

    filtroEstado.addEventListener("change", pintarLista);
    btnRefrescar.addEventListener("click", cargarPedidos);

    listaPedidos.addEventListener("change", async (evento) => {
      const select = evento.target.closest(".select-estado");
      if (!select) return;
      const id = select.dataset.id;
      const nuevoEstado = select.value;
      select.disabled = true;
      try {
        await actualizarEstadoPedido(id, nuevoEstado);
        pedidosCache[id].estado = nuevoEstado;
        mostrarMensaje(resPedidos, `Pedido ${id} actualizado a "${nuevoEstado}".`);
        pintarLista();
      } catch (error) {
        console.error("Error al actualizar estado:", error);
        mostrarMensaje(resPedidos, error.message || "No se pudo actualizar el estado.", "error");
      } finally {
        select.disabled = false;
      }
    });

    observarSesion((token) => {
      const haySesion = Boolean(token);
      vistaLogin.classList.toggle("oculto", haySesion);
      vistaPedidos.classList.toggle("oculto", !haySesion);
      if (haySesion) {
        cargarPedidos();
        if (!intervaloAuto) {
          intervaloAuto = setInterval(cargarPedidos, 15000);
        }
      } else if (intervaloAuto) {
        clearInterval(intervaloAuto);
        intervaloAuto = null;
      }
    });

    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      btnLogin.disabled = true;
      btnLogin.textContent = "Ingresando...";
      resLogin.textContent = "";
      try {
        await iniciarSesion(email, password);
        formLogin.reset();
      } catch (error) {
        mostrarMensaje(resLogin, mensajeErrorAuth(error), "error");
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "INICIAR SESIÓN";
      }
    });

    btnLogout.addEventListener("click", () => cerrarSesion());
    poblarFiltro();
  </script>
</body>
</html>
