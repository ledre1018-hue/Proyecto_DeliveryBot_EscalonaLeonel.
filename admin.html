<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliveryBot - Gestión de Menú</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-principal contenedor-ancho">
    <section id="vista-login">
      <h2>Acceso Administrador</h2>
      <p class="texto-ayuda">Inicia sesión para gestionar el menú.</p>
      <form id="form-login">
        <div class="item">
          <label for="email">Correo</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="item">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login">INICIAR SESIÓN</button>
      </form>
      <div id="res-login" role="status" aria-live="polite"></div>
    </section>

    <section id="vista-admin" class="oculto">
      <div class="admin-header">
        <h2>Gestión de Menú</h2>
        <button type="button" id="btn-logout" class="btn-secundario">Cerrar sesión</button>
      </div>

      <form id="form-menu">
        <div class="fila-form">
          <div class="item">
            <label for="nombre-plato">Nombre del plato</label>
            <input type="text" id="nombre-plato" placeholder="Ej. Café Americano" required>
          </div>
          <div class="item">
            <label for="precio-plato">Precio</label>
            <input type="number" id="precio-plato" min="1" step="any" placeholder="Ej. 3500" required>
          </div>
        </div>
        <div class="fila-form">
          <div class="item">
            <label for="categoria-plato">Categoría</label>
            <select id="categoria-plato" required></select>
          </div>
          <div class="item">
            <label for="stock-plato">Stock inicial</label>
            <input type="number" id="stock-plato" min="0" step="1" placeholder="Ej. 20" required>
          </div>
        </div>
        <div class="item">
          <label for="descripcion-plato">Descripción</label>
          <input type="text" id="descripcion-plato" placeholder="Ej. Café negro 250ml">
        </div>
        <button type="submit" id="btn-guardar">AGREGAR PLATO</button>
      </form>

      <div id="res-menu" role="status" aria-live="polite"></div>

      <div class="lista-header">
        <h3>Menú actual</h3>
      </div>
      <ul id="lista-menu" class="lista-platos">
        <li class="lista-vacia">Cargando menú...</li>
      </ul>

      <div class="nav-link">
        <a href="comanda.html">Ver pedidos</a> ·
        <a href="stock.html">Gestionar stock</a> ·
        <a href="index.html">Inicio</a>
      </div>
    </section>
  </div>

  <script type="module">
    import { iniciarSesion, cerrarSesion, observarSesion, mensajeErrorAuth } from "./js/auth.js";
    import { obtenerMenu, agregarPlato, actualizarPlato, eliminarPlato, CATEGORIAS_MENU } from "./js/menu.js";
    import { formatearMoneda } from "./js/pedido.js";

    const vistaLogin = document.getElementById("vista-login");
    const vistaAdmin = document.getElementById("vista-admin");
    const formLogin = document.getElementById("form-login");
    const btnLogin = document.getElementById("btn-login");
    const resLogin = document.getElementById("res-login");
    const btnLogout = document.getElementById("btn-logout");
    const formMenu = document.getElementById("form-menu");
    const inputNombre = document.getElementById("nombre-plato");
    const inputPrecio = document.getElementById("precio-plato");
    const selectCategoria = document.getElementById("categoria-plato");
    const inputStock = document.getElementById("stock-plato");
    const inputDescripcion = document.getElementById("descripcion-plato");
    const btnGuardar = document.getElementById("btn-guardar");
    const resMenu = document.getElementById("res-menu");
    const listaMenu = document.getElementById("lista-menu");

    let menuCache = {};

    function mostrarMensaje(el, texto, tipo = "exito") {
      el.textContent = texto;
      el.classList.remove("mensaje-error", "mensaje-exito");
      el.classList.add(tipo === "error" ? "mensaje-error" : "mensaje-exito");
    }

    function poblarCategorias() {
      selectCategoria.innerHTML = CATEGORIAS_MENU
        .map((c) => `<option value="${c}">${c}</option>`)
        .join("");
    }

    async function renderizarMenu() {
      try {
        menuCache = await obtenerMenu();
        const entradas = Object.entries(menuCache);
        if (entradas.length === 0) {
          listaMenu.innerHTML = '<li class="lista-vacia">No hay platos en el menú.</li>';
          return;
        }
        listaMenu.innerHTML = "";
        entradas.forEach(([id, plato]) => {
          const li = document.createElement("li");
          li.className = "fila-plato";
          li.innerHTML = `
            <span class="fila-plato-nombre">
              ${plato.nombre}
              <span class="etiqueta-categoria">${plato.categoria}</span>
            </span>
            <input type="number" class="input-precio-fila" min="1" step="any" value="${plato.precio}" data-id="${id}" aria-label="Precio de ${plato.nombre}">
            <button type="button" class="btn-guardar-precio" data-id="${id}" title="Guardar cambios">💾</button>
            <button type="button" class="btn-eliminar" data-id="${id}" aria-label="Eliminar ${plato.nombre}">✕</button>
          `;
          listaMenu.appendChild(li);
        });
      } catch (error) {
        console.error("Error al listar menú:", error);
        listaMenu.innerHTML = '<li class="lista-vacia">No se pudo cargar el menú.</li>';
      }
    }

    listaMenu.addEventListener("click", async (evento) => {
      const botonGuardar = evento.target.closest(".btn-guardar-precio");
      if (botonGuardar) {
        const id = botonGuardar.dataset.id;
        const input = listaMenu.querySelector(`.input-precio-fila[data-id="${id}"]`);
        botonGuardar.disabled = true;
        try {
          await actualizarPlato(id, { precio: Number(input.value) });
          menuCache[id].precio = Number(input.value);
          mostrarMensaje(resMenu, "Precio actualizado correctamente.");
        } catch (error) {
          console.error("Error al actualizar precio:", error);
          mostrarMensaje(resMenu, error.message || "No se pudo actualizar el precio.", "error");
        } finally {
          botonGuardar.disabled = false;
        }
        return;
      }

      const boton = evento.target.closest(".btn-eliminar");
      if (!boton) return;
      const id = boton.dataset.id;
      const nombre = menuCache[id]?.nombre;
      if (!confirm(`¿Eliminar "${nombre}" del menú?`)) return;
      boton.disabled = true;
      try {
        await eliminarPlato(id);
        mostrarMensaje(resMenu, `"${nombre}" fue eliminado del menú.`);
        await renderizarMenu();
      } catch (error) {
        console.error("Error al eliminar plato:", error);
        mostrarMensaje(resMenu, error.message || "No se pudo eliminar el plato.", "error");
        boton.disabled = false;
      }
    });

    observarSesion((token) => {
      const haySesion = Boolean(token);
      vistaLogin.classList.toggle("oculto", haySesion);
      vistaAdmin.classList.toggle("oculto", !haySesion);
      if (haySesion) renderizarMenu();
    });

    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      btnLogin.disabled = true;
      btnLogin.textContent = "Ingresando...";
      resLogin.textContent = "";
      try {
        await iniciarSesion(email, password);
        formLogin.reset();
      } catch (error) {
        mostrarMensaje(resLogin, mensajeErrorAuth(error), "error");
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "INICIAR SESIÓN";
      }
    });

    btnLogout.addEventListener("click", () => cerrarSesion());

    formMenu.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardando...";
      try {
        await agregarPlato({
          nombre: inputNombre.value,
          descripcion: inputDescripcion.value,
          precio: inputPrecio.value,
          categoria: selectCategoria.value,
          stock: inputStock.value,
        });
        mostrarMensaje(resMenu, "¡Plato agregado al menú!");
        formMenu.reset();
        await renderizarMenu();
      } catch (error) {
        console.error("Error al guardar plato:", error);
        mostrarMensaje(resMenu, error.message || "Error al guardar el plato.", "error");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "AGREGAR PLATO";
      }
    });

    poblarCategorias();
  </script>
</body>
</html>
