<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliveryBot - Mesero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-principal">
    <h2>RestoApp — Mesero</h2>

    <div class="item">
      <label for="input-mesa">Mesa</label>
      <input type="text" id="input-mesa" placeholder="Ej. Mesa 4 / Barra 2" required>
    </div>

    <div class="fila-form">
      <div class="item">
        <label for="select-plato">Plato</label>
        <select id="select-plato">
          <option value="">--Selecciona un plato--</option>
        </select>
      </div>
      <div class="item">
        <label for="input-cantidad">Cantidad</label>
        <input type="number" id="input-cantidad" min="1" step="1" value="1">
      </div>
    </div>

    <button type="button" id="btn-agregar-carrito">+ Agregar al pedido</button>

    <div id="res-mesero" role="status" aria-live="polite"></div>

    <div class="lista-header">
      <h3>Pedido actual</h3>
      <span class="badge-contador" id="contador-carrito">0</span>
    </div>
    <ul id="lista-carrito" class="lista-platos">
      <li class="lista-vacia">Todavía no agregaste ningún plato.</li>
    </ul>

    <div class="carrito-totales">
      <div class="fila-total fila-total-grande">
        <span>Total</span>
        <span id="total-carrito">$0</span>
      </div>
    </div>

    <button type="button" id="btn-confirmar-pedido">CONFIRMAR PEDIDO</button>

    <div class="nav-link">
      ¿Prefieres pedir desde tu celular?
      <a href="https://t.me/hollw55bot" target="_blank" rel="noopener">Pide por Telegram</a>
    </div>

    <div class="nav-link">
      <a href="admin.html">Panel de Administración</a> ·
      <a href="comanda.html">Panel de Cocina</a> ·
      <a href="stock.html">Gestionar Stock</a>
    </div>
  </div>

  <script type="module">
    import { obtenerMenu } from "./js/menu.js";
    import { crearPedido } from "./js/pedidos.js";
    import { formatearMoneda } from "./js/pedido.js";

    const inputMesa = document.getElementById("input-mesa");
    const selectPlato = document.getElementById("select-plato");
    const inputCantidad = document.getElementById("input-cantidad");
    const btnAgregarCarrito = document.getElementById("btn-agregar-carrito");
    const resMesero = document.getElementById("res-mesero");
    const listaCarrito = document.getElementById("lista-carrito");
    const contadorCarrito = document.getElementById("contador-carrito");
    const totalCarritoEl = document.getElementById("total-carrito");
    const btnConfirmarPedido = document.getElementById("btn-confirmar-pedido");

    let menuCache = {};
    let carrito = [];

    function mostrarMensaje(texto, tipo = "exito") {
      resMesero.textContent = texto;
      resMesero.classList.remove("mensaje-error", "mensaje-exito");
      resMesero.classList.add(tipo === "error" ? "mensaje-error" : "mensaje-exito");
    }

    function calcularTotal() {
      return carrito.reduce((acc, item) => acc + item.precio * item.cantidad, 0);
    }

    function renderizarCarrito() {
      contadorCarrito.textContent = carrito.length;
      totalCarritoEl.textContent = formatearMoneda(calcularTotal());

      if (carrito.length === 0) {
        listaCarrito.innerHTML = '<li class="lista-vacia">Todavía no agregaste ningún plato.</li>';
        return;
      }

      listaCarrito.innerHTML = "";
      carrito.forEach((item, indice) => {
        const li = document.createElement("li");
        li.className = "fila-plato";
        li.innerHTML = `
          <span class="fila-plato-nombre">${item.cantidad} x ${item.nombre}</span>
          <span class="fila-plato-precio">${formatearMoneda(item.precio * item.cantidad)}</span>
          <button type="button" class="btn-eliminar" data-indice="${indice}">✕</button>
        `;
        listaCarrito.appendChild(li);
      });
    }

    async function cargarMenu() {
      try {
        menuCache = await obtenerMenu();
        const entradas = Object.entries(menuCache);
        selectPlato.innerHTML =
          '<option value="">--Selecciona un plato--</option>' +
          entradas
            .map(([id, plato]) => `<option value="${id}">${plato.nombre} - ${formatearMoneda(plato.precio)}</option>`)
            .join("");
      } catch (error) {
        console.error("Error al cargar menú:", error);
        mostrarMensaje("No se pudo cargar el menú.", "error");
      }
    }

    btnAgregarCarrito.addEventListener("click", () => {
      const idPlato = selectPlato.value;
      const cantidad = Number(inputCantidad.value);

      if (!idPlato) {
        mostrarMensaje("Selecciona un plato.", "error");
        return;
      }
      if (!Number.isFinite(cantidad) || cantidad <= 0) {
        mostrarMensaje("Ingresa una cantidad válida.", "error");
        return;
      }

      const plato = menuCache[idPlato];
      const itemExistente = carrito.find((item) => item.id === idPlato);
      if (itemExistente) {
        itemExistente.cantidad += cantidad;
      } else {
        carrito.push({ id: idPlato, nombre: plato.nombre, precio: plato.precio, cantidad });
      }

      selectPlato.value = "";
      inputCantidad.value = 1;
      resMesero.textContent = "";
      renderizarCarrito();
    });

    listaCarrito.addEventListener("click", (evento) => {
      const boton = evento.target.closest(".btn-eliminar");
      if (!boton) return;
      const indice = Number(boton.dataset.indice);
      carrito.splice(indice, 1);
      renderizarCarrito();
    });

    btnConfirmarPedido.addEventListener("click", async () => {
      const mesa = inputMesa.value.trim();

      if (!mesa) {
        mostrarMensaje("Indica la mesa o el punto de entrega.", "error");
        return;
      }
      if (carrito.length === 0) {
        mostrarMensaje("Agrega al menos un plato al pedido.", "error");
        return;
      }

      const detalles = carrito.map((item) => `${item.cantidad}x ${item.nombre}`).join(", ");
      const total = calcularTotal();

      btnConfirmarPedido.disabled = true;
      btnConfirmarPedido.textContent = "Enviando...";
      try {
        await crearPedido({ idUsuario: mesa, detallesPedido: detalles, totalPago: total });
        mostrarMensaje("¡Pedido enviado a cocina!");
        carrito = [];
        inputMesa.value = "";
        renderizarCarrito();
      } catch (error) {
        console.error("Error al confirmar pedido:", error);
        mostrarMensaje(error.message || "No se pudo enviar el pedido.", "error");
      } finally {
        btnConfirmarPedido.disabled = false;
        btnConfirmarPedido.textContent = "CONFIRMAR PEDIDO";
      }
    });

    cargarMenu();
  </script>
</body>
</html>
