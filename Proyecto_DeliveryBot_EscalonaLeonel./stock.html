<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Gestión de Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-principal contenedor-ancho">

    <section id="vista-login">
      <h2>Acceso Administrador</h2>
      <p class="texto-ayuda">Inicia sesión para gestionar el stock de materia prima.</p>
      <form id="form-login">
        <div class="item">
          <label for="email">Correo</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="item">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login">INICIAR SESIÓN</button>
      </form>
      <div id="res-login" role="status" aria-live="polite"></div>
    </section>

    <section id="vista-stock" class="oculto">
      <div class="admin-header">
        <h2>Gestión de Stock</h2>
        <button type="button" id="btn-logout" class="btn-secundario">Cerrar sesión</button>
      </div>

      <form id="form-stock">
        <div class="fila-form">
          <div class="item">
            <label for="nombre-ingrediente">Ingrediente</label>
            <input type="text" id="nombre-ingrediente" placeholder="Ej. Pan brioche" required>
          </div>
          <div class="item">
            <label for="cantidad-ingrediente">Cantidad</label>
            <input type="number" id="cantidad-ingrediente" min="0" step="any" placeholder="Ej. 50" required>
          </div>
        </div>
        <div class="fila-form">
          <div class="item">
            <label for="unidad-ingrediente">Unidad</label>
            <select id="unidad-ingrediente" required></select>
          </div>
          <div class="item">
            <label for="categoria-ingrediente">Categoría</label>
            <select id="categoria-ingrediente" required></select>
          </div>
        </div>
        <button type="submit" id="btn-guardar-stock">AGREGAR AL INVENTARIO</button>
      </form>

      <div id="res-stock" role="status" aria-live="polite"></div>

      <div class="lista-header">
        <h3>Inventario</h3>
        <select id="filtro-categoria" class="filtro-select"></select>
      </div>
      <ul id="lista-stock" class="lista-platos">
        <li class="lista-vacia">Cargando inventario...</li>
      </ul>

      <div class="nav-link">
        <a href="admin.html">← Volver a Gestión de Menú</a>
      </div>
    </section>

    <div class="nav-link">
      <a href="index.html">Ir al módulo de pedidos (mesero)</a>
    </div>
  </div>

  <script type="module">
    import { iniciarSesion, cerrarSesion, observarSesion, mensajeErrorAuth } from "./js/auth.js";
    import {
      obtenerStock,
      agregarIngrediente,
      actualizarCantidad,
      eliminarIngrediente,
      CATEGORIAS_STOCK,
      UNIDADES_STOCK,
    } from "./js/stock.js";

    const vistaLogin = document.getElementById('vista-login');
    const vistaStock = document.getElementById('vista-stock');

    const formLogin = document.getElementById('form-login');
    const btnLogin = document.getElementById('btn-login');
    const resLogin = document.getElementById('res-login');
    const btnLogout = document.getElementById('btn-logout');

    const formStock = document.getElementById('form-stock');
    const inputNombre = document.getElementById('nombre-ingrediente');
    const inputCantidad = document.getElementById('cantidad-ingrediente');
    const selectUnidad = document.getElementById('unidad-ingrediente');
    const selectCategoria = document.getElementById('categoria-ingrediente');
    const btnGuardarStock = document.getElementById('btn-guardar-stock');
    const resStock = document.getElementById('res-stock');

    const listaStock = document.getElementById('lista-stock');
    const filtroCategoria = document.getElementById('filtro-categoria');

    let inventarioCache = {};

    function mostrarMensaje(el, texto, tipo = 'exito') {
      el.textContent = texto;
      el.classList.remove('mensaje-error', 'mensaje-exito');
      el.classList.add(tipo === 'error' ? 'mensaje-error' : 'mensaje-exito');
    }

    function poblarSelects() {
      selectUnidad.innerHTML = UNIDADES_STOCK
        .map((u) => `<option value="${u}">${u}</option>`)
        .join('');

      selectCategoria.innerHTML = CATEGORIAS_STOCK
        .map((c) => `<option value="${c}">${c}</option>`)
        .join('');

      filtroCategoria.innerHTML =
        '<option value="">Todas las categorías</option>' +
        CATEGORIAS_STOCK.map((c) => `<option value="${c}">${c}</option>`).join('');
    }

    async function renderizarStock() {
      try {
        inventarioCache = await obtenerStock();
        pintarLista();
      } catch (error) {
        console.error('Error al listar stock:', error);
        listaStock.innerHTML = '<li class="lista-vacia">No se pudo cargar el inventario.</li>';
      }
    }

    function pintarLista() {
      const filtro = filtroCategoria.value;
      const entradas = Object.entries(inventarioCache)
        .filter(([, item]) => !filtro || item.categoria === filtro);

      if (entradas.length === 0) {
        listaStock.innerHTML = '<li class="lista-vacia">No hay ingredientes en esta categoría.</li>';
        return;
      }

      listaStock.innerHTML = '';
      entradas.forEach(([id, item]) => {
        const li = document.createElement('li');
        li.className = 'fila-plato';
        li.innerHTML = `
          <span class="fila-plato-nombre">
            ${item.nombre}
            <span class="etiqueta-categoria">${item.categoria}</span>
          </span>
          <input type="number" class="input-precio-fila" min="0" step="any" value="${item.cantidad}" data-id="${id}" data-original="${item.cantidad}" aria-label="Cantidad de ${item.nombre}">
          <span class="fila-plato-precio">${item.unidad}</span>
          <button type="button" class="btn-guardar-precio" data-id="${id}" title="Guardar cantidad">💾</button>
          <button type="button" class="btn-eliminar" data-id="${id}" aria-label="Eliminar ${item.nombre}">✕</button>
        `;
        listaStock.appendChild(li);
      });
    }

    filtroCategoria.addEventListener('change', pintarLista);

    listaStock.addEventListener('click', async (evento) => {
      const botonGuardar = evento.target.closest('.btn-guardar-precio');
      if (botonGuardar) {
        const id = botonGuardar.dataset.id;
        const input = listaStock.querySelector(`.input-precio-fila[data-id="${id}"]`);

        botonGuardar.disabled = true;
        try {
          await actualizarCantidad(id, input.value);
          input.dataset.original = input.value;
          inventarioCache[id].cantidad = Number(input.value);
          mostrarMensaje(resStock, 'Cantidad actualizada correctamente.');
        } catch (error) {
          console.error('Error al actualizar cantidad:', error);
          mostrarMensaje(resStock, error.message || 'No se pudo actualizar la cantidad.', 'error');
          input.value = input.dataset.original;
        } finally {
          botonGuardar.disabled = false;
        }
        return;
      }

      const boton = evento.target.closest('.btn-eliminar');
      if (!boton) return;

      const id = boton.dataset.id;
      const nombre = inventarioCache[id]?.nombre;
      if (!confirm(`¿Eliminar "${nombre}" del inventario?`)) return;

      boton.disabled = true;
      try {
        await eliminarIngrediente(id);
        mostrarMensaje(resStock, `"${nombre}" fue eliminado del inventario.`);
        await renderizarStock();
      } catch (error) {
        console.error('Error al eliminar ingrediente:', error);
        mostrarMensaje(resStock, error.message || 'No se pudo eliminar el ingrediente.', 'error');
        boton.disabled = false;
      }
    });

    observarSesion((usuario) => {
      const haySesion = Boolean(usuario);
      vistaLogin.classList.toggle('oculto', haySesion);
      vistaStock.classList.toggle('oculto', !haySesion);
      if (haySesion) renderizarStock();
    });

    formLogin.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btnLogin.disabled = true;
      btnLogin.textContent = 'Ingresando...';
      resLogin.textContent = '';

      try {
        await iniciarSesion(email, password);
        formLogin.reset();
      } catch (error) {
        mostrarMensaje(resLogin, mensajeErrorAuth(error), 'error');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'INICIAR SESIÓN';
      }
    });

    btnLogout.addEventListener('click', () => cerrarSesion());

    formStock.addEventListener('submit', async (evento) => {
      evento.preventDefault();

      btnGuardarStock.disabled = true;
      btnGuardarStock.textContent = 'Guardando...';

      try {
        await agregarIngrediente(
          inputNombre.value,
          inputCantidad.value,
          selectUnidad.value,
          selectCategoria.value
        );
        mostrarMensaje(resStock, '¡Ingrediente agregado al inventario!');
        formStock.reset();
        await renderizarStock();
      } catch (error) {
        console.error('Error al guardar ingrediente:', error);
        mostrarMensaje(resStock, error.message || 'Error al guardar el ingrediente.', 'error');
      } finally {
        btnGuardarStock.disabled = false;
        btnGuardarStock.textContent = 'AGREGAR AL INVENTARIO';
      }
    });

    poblarSelects();
  </script>
</body>
</html>
