<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Toma de Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-principal contenedor-ancho">
    <h2>RestoApp — Mesero</h2>

    <div class="fila-form">
      <div class="item">
        <label for="tipo-pedido">Tipo de pedido</label>
        <select id="tipo-pedido" required>
          <option value="Mesa">Mesa (comer en el restaurante)</option>
          <option value="Domicilio">Domicilio</option>
          <option value="Reserva">Reserva</option>
        </select>
      </div>
      <div class="item">
        <label for="mesa" id="label-mesa">Número de mesa</label>
        <input type="text" id="mesa" placeholder="Ej. Mesa 4" required>
      </div>
    </div>

    <form id="form-agregar">
      <div class="fila-form">
        <div class="item">
          <label for="select-menu">Plato</label>
          <select id="select-menu" required>
            <option value="">--Cargando menú--</option>
          </select>
        </div>
        <div class="item">
          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" min="1" value="1" required>
        </div>
      </div>
      <button type="submit" id="btn-agregar" class="btn-secundario">+ Agregar al pedido</button>
    </form>

    <div class="lista-header">
      <h3>Pedido actual</h3>
      <span id="contador-items" class="badge-contador">0</span>
    </div>
    <ul id="carrito-lista" class="lista-platos">
      <li class="lista-vacia">Todavía no agregaste ningún plato.</li>
    </ul>

    <div id="carrito-totales" class="carrito-totales oculto">
      <div class="fila-total"><span>Subtotal</span><span id="txt-subtotal">$0</span></div>
      <div class="fila-total"><span>IVA (19%)</span><span id="txt-iva">$0</span></div>
      <div class="fila-total fila-total-grande"><span>Total</span><span id="txt-total">$0</span></div>
    </div>

    <button type="button" id="btn-confirmar">CONFIRMAR PEDIDO</button>

    <div id="res" role="status" aria-live="polite"></div>

    <div class="nav-link">
      <a href="admin.html">Ir al Panel de Administración</a>
    </div>
  </div>

  <script type="module">
    import { obtenerMenu } from "./js/menu.js";
    import { crearPedido } from "./js/pedidos.js";
    import { calcularTotalCarrito, formatearMoneda } from "./js/pedido.js";

    let menuCache = {};
    let carrito = [];

    const selectTipoPedido = document.getElementById('tipo-pedido');
    const labelMesa = document.getElementById('label-mesa');
    const inputMesa = document.getElementById('mesa');

    const formAgregar = document.getElementById('form-agregar');
    const selectMenu = document.getElementById('select-menu');
    const inputCantidad = document.getElementById('cantidad');

    const carritoLista = document.getElementById('carrito-lista');
    const contadorItems = document.getElementById('contador-items');
    const carritoTotales = document.getElementById('carrito-totales');
    const txtSubtotal = document.getElementById('txt-subtotal');
    const txtIva = document.getElementById('txt-iva');
    const txtTotal = document.getElementById('txt-total');

    const btnConfirmar = document.getElementById('btn-confirmar');
    const divRes = document.getElementById('res');

    const ETIQUETAS_CAMPO = {
      Mesa: { label: 'Número de mesa', placeholder: 'Ej. Mesa 4' },
      Domicilio: { label: 'Dirección de entrega', placeholder: 'Ej. Calle 45 #12-30' },
      Reserva: { label: 'Fecha y hora de la reserva', placeholder: 'Ej. 28/08 8:00 PM, a nombre de...' },
    };

    function mostrarMensaje(texto, tipo = 'exito') {
      divRes.textContent = texto;
      divRes.classList.remove('mensaje-error', 'mensaje-exito');
      divRes.classList.add(tipo === 'error' ? 'mensaje-error' : 'mensaje-exito');
    }

    function actualizarEtiquetaCampo() {
      const config = ETIQUETAS_CAMPO[selectTipoPedido.value];
      labelMesa.textContent = config.label;
      inputMesa.placeholder = config.placeholder;
      inputMesa.value = '';
    }

    async function inicializarMenu() {
      try {
        menuCache = await obtenerMenu();
        const entradas = Object.entries(menuCache);

        if (entradas.length === 0) {
          selectMenu.innerHTML = '<option value="">--No hay platos disponibles--</option>';
          return;
        }

        selectMenu.innerHTML = '<option value="">--Selecciona un plato--</option>';
        entradas.forEach(([id, plato]) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = `${plato.name} (${formatearMoneda(plato.price)})`;
          selectMenu.appendChild(opt);
        });
      } catch (error) {
        console.error("Error al cargar el menú:", error);
        selectMenu.innerHTML = '<option value="">--Error al cargar el menú--</option>';
        mostrarMensaje('No se pudo cargar el menú. Revisa tu conexión e intenta de nuevo.', 'error');
      }
    }

    function renderizarCarrito() {
      contadorItems.textContent = carrito.length;

      if (carrito.length === 0) {
        carritoLista.innerHTML = '<li class="lista-vacia">Todavía no agregaste ningún plato.</li>';
        carritoTotales.classList.add('oculto');
        btnConfirmar.disabled = true;
        return;
      }

      carritoLista.innerHTML = '';
      carrito.forEach((item, indice) => {
        const li = document.createElement('li');
        li.className = 'fila-plato';
        li.innerHTML = `
          <span class="fila-plato-nombre">${item.nombre} × ${item.cantidad}</span>
          <span class="fila-plato-precio">${formatearMoneda(item.cantidad * item.precioUnitario)}</span>
          <button type="button" class="btn-eliminar" data-indice="${indice}" aria-label="Quitar ${item.nombre}">✕</button>
        `;
        carritoLista.appendChild(li);
      });

      const { subtotal, iva, total } = calcularTotalCarrito(
        carrito.map(({ cantidad, precioUnitario }) => ({ cantidad, precioUnitario }))
      );
      txtSubtotal.textContent = formatearMoneda(subtotal);
      txtIva.textContent = formatearMoneda(iva);
      txtTotal.textContent = formatearMoneda(total);
      carritoTotales.classList.remove('oculto');
      btnConfirmar.disabled = false;
    }

    selectTipoPedido.addEventListener('change', actualizarEtiquetaCampo);

    formAgregar.addEventListener('submit', (evento) => {
      evento.preventDefault();

      const platoId = selectMenu.value;
      const plato = menuCache[platoId];
      const cantidad = Number(inputCantidad.value);

      if (!plato) {
        mostrarMensaje('Selecciona un plato válido antes de agregarlo.', 'error');
        return;
      }
      if (!Number.isFinite(cantidad) || cantidad <= 0) {
        mostrarMensaje('La cantidad debe ser mayor a 0.', 'error');
        return;
      }

      const existente = carrito.find((item) => item.platoId === platoId);
      if (existente) {
        existente.cantidad += cantidad;
      } else {
        carrito.push({
          platoId,
          nombre: plato.name,
          precioUnitario: plato.price,
          cantidad,
        });
      }

      formAgregar.reset();
      inputCantidad.value = 1;
      renderizarCarrito();
    });

    carritoLista.addEventListener('click', (evento) => {
      const boton = evento.target.closest('.btn-eliminar');
      if (!boton) return;
      carrito.splice(Number(boton.dataset.indice), 1);
      renderizarCarrito();
    });

    btnConfirmar.addEventListener('click', async () => {
      const mesaODireccion = inputMesa.value.trim();

      if (!mesaODireccion) {
        mostrarMensaje(`Completa "${labelMesa.textContent}" antes de confirmar.`, 'error');
        inputMesa.focus();
        return;
      }
      if (carrito.length === 0) {
        mostrarMensaje('Agrega al menos un plato antes de confirmar.', 'error');
        return;
      }

      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Enviando pedido...';

      try {
        const { subtotal, iva, total } = calcularTotalCarrito(
          carrito.map(({ cantidad, precioUnitario }) => ({ cantidad, precioUnitario }))
        );

        const items = carrito.map(({ platoId, nombre, precioUnitario, cantidad }) => ({
          platoId,
          nombre,
          precioUnitario,
          cantidad,
          subtotal: precioUnitario * cantidad,
        }));

        const resultado = await crearPedido({
          tipoPedido: selectTipoPedido.value,
          mesaODireccion,
          items,
          subtotal,
          iva,
          total,
        });

        const idPedido = resultado?.id || 'nuevo';
        mostrarMensaje(
          `Pedido #${String(idPedido).slice(-6)} enviado (${selectTipoPedido.value}) — Total: ${formatearMoneda(total)}`
        );

        carrito = [];
        renderizarCarrito();
      } catch (error) {
        console.error('Error al confirmar pedido:', error);
        mostrarMensaje(error.message || 'No se pudo enviar el pedido. Intenta de nuevo.', 'error');
      } finally {
        btnConfirmar.disabled = carrito.length === 0;
        btnConfirmar.textContent = 'CONFIRMAR PEDIDO';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      actualizarEtiquetaCampo();
      renderizarCarrito();
      inicializarMenu();
    });
  </script>
</body>
</html>
