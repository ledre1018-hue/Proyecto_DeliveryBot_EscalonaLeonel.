<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliveryBot - Gestión de Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-principal contenedor-ancho">
    <section id="vista-login">
      <h2>Acceso Administrador</h2>
      <p class="texto-ayuda">Inicia sesión para gestionar el stock del menú.</p>
      <form id="form-login">
        <div class="item">
          <label for="email">Correo</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="item">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login">INICIAR SESIÓN</button>
      </form>
      <div id="res-login" role="status" aria-live="polite"></div>
    </section>

    <section id="vista-stock" class="oculto">
      <div class="admin-header">
        <h2>Gestión de Stock</h2>
        <button type="button" id="btn-logout" class="btn-secundario">Cerrar sesión</button>
      </div>

      <div id="res-stock" role="status" aria-live="polite"></div>

      <div class="lista-header">
        <h3>Stock por producto</h3>
      </div>
      <ul id="lista-stock" class="lista-platos">
        <li class="lista-vacia">Cargando menú...</li>
      </ul>

      <div class="nav-link">
        <a href="admin.html">← Gestión de Menú</a>
      </div>
    </section>

    <div class="nav-link">
      <a href="index.html">Inicio</a>
    </div>
  </div>

  <script type="module">
    import { iniciarSesion, cerrarSesion, observarSesion, mensajeErrorAuth } from "./js/auth.js";
    import { obtenerStock, actualizarStock } from "./js/stock.js";

    const vistaLogin = document.getElementById("vista-login");
    const vistaStock = document.getElementById("vista-stock");
    const formLogin = document.getElementById("form-login");
    const btnLogin = document.getElementById("btn-login");
    const resLogin = document.getElementById("res-login");
    const btnLogout = document.getElementById("btn-logout");
    const resStock = document.getElementById("res-stock");
    const listaStock = document.getElementById("lista-stock");

    let stockCache = {};

    function mostrarMensaje(el, texto, tipo = "exito") {
      el.textContent = texto;
      el.classList.remove("mensaje-error", "mensaje-exito");
      el.classList.add(tipo === "error" ? "mensaje-error" : "mensaje-exito");
    }

    async function renderizarStock() {
      try {
        stockCache = await obtenerStock();
        const entradas = Object.entries(stockCache);
        if (entradas.length === 0) {
          listaStock.innerHTML = '<li class="lista-vacia">No hay productos en el menú.</li>';
          return;
        }
        listaStock.innerHTML = "";
        entradas.forEach(([id, producto]) => {
          const li = document.createElement("li");
          li.className = "fila-plato";
          li.innerHTML = `
            <span class="fila-plato-nombre">
              ${producto.nombre}
              <span class="etiqueta-categoria">${producto.categoria}</span>
            </span>
            <input type="number" class="input-precio-fila" min="0" step="1" value="${producto.stock}" data-id="${id}" aria-label="Stock de ${producto.nombre}">
            <button type="button" class="btn-guardar-precio" data-id="${id}" title="Guardar stock">💾</button>
          `;
          listaStock.appendChild(li);
        });
      } catch (error) {
        console.error("Error al listar stock:", error);
        listaStock.innerHTML = '<li class="lista-vacia">No se pudo cargar el stock.</li>';
      }
    }

    listaStock.addEventListener("click", async (evento) => {
      const boton = evento.target.closest(".btn-guardar-precio");
      if (!boton) return;
      const id = boton.dataset.id;
      const input = listaStock.querySelector(`.input-precio-fila[data-id="${id}"]`);
      boton.disabled = true;
      try {
        await actualizarStock(id, input.value);
        stockCache[id].stock = Number(input.value);
        mostrarMensaje(resStock, "Stock actualizado correctamente.");
      } catch (error) {
        console.error("Error al actualizar stock:", error);
        mostrarMensaje(resStock, error.message || "No se pudo actualizar el stock.", "error");
      } finally {
        boton.disabled = false;
      }
    });

    observarSesion((token) => {
      const haySesion = Boolean(token);
      vistaLogin.classList.toggle("oculto", haySesion);
      vistaStock.classList.toggle("oculto", !haySesion);
      if (haySesion) renderizarStock();
    });

    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      btnLogin.disabled = true;
      btnLogin.textContent = "Ingresando...";
      resLogin.textContent = "";
      try {
        await iniciarSesion(email, password);
        formLogin.reset();
      } catch (error) {
        mostrarMensaje(resLogin, mensajeErrorAuth(error), "error");
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "INICIAR SESIÓN";
      }
    });

    btnLogout.addEventListener("click", () => cerrarSesion());
  </script>
</body>
</html>
